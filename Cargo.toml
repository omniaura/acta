[package]
name = "acta"
version = "0.2.0"
edition = "2021"
authors = ["Peyton Spencer <peyton@omniaura.com>"]
description = "A terminal multiplexer for agentic coding"
license = "MIT"
repository = "https://github.com/omniaura/acta"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"

# TUI framework
ratatui = "0.28"
crossterm = "0.28"

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# PTY handling for detachable sessions
portable-pty = "0.9"

# Unix process control (setsid, signals, flock)
nix = { version = "0.29", features = ["process", "signal", "fs", "term"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Encoding (OSC52 clipboard fallback)
base64 = "0.22"

# Git operations use the system `git` binary (see src/git) — no libgit2/OpenSSL needed.

# Utilities
dirs = "6.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.14"
